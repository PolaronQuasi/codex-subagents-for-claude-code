name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ startsWith(matrix.os, 'windows-') && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check formatting
        run: npm run format:check
      - name: Check source, render isolated definitions and test
        run: node tools/ci.mjs
      - name: Install the supported Codex schema generator
        run: npm install --global @openai/codex@0.166.0
      - name: Check the generated protocol and fake driver
        run: npm run contract
